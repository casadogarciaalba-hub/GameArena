<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameArena · Panel del administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #mensaje { display: none; }
        .resultado { margin-top: 15px; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold">GameArena · Panel del administrador</span>
    </div>
</nav>

<main class="container pb-5">

    <div id="mensaje"></div>

    <!-- Pestañas -->
    <ul class="nav nav-tabs" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabTorneos" type="button">Torneos</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabJugadores" type="button">Jugadores</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabVideojuegos" type="button">Videojuegos</button>
        </li>
    </ul>

    <div class="tab-content bg-white border border-top-0 rounded-bottom p-4">

        <!-- ===================== TORNEOS ===================== -->
        <div class="tab-pane fade show active" id="tabTorneos">
            <h2 class="mb-3">Torneos</h2>

            <label class="form-label" for="buscarTorneoId">Buscar por ID</label>
            <div class="d-flex gap-2 mb-3" style="max-width: 400px;">
                <input type="number" class="form-control" id="buscarTorneoId" min="1">
                <button type="button" class="btn btn-outline-primary" id="botonBuscarTorneo">Buscar</button>
            </div>

            <div class="row g-2 align-items-end mb-3">
                <div class="col-auto">
                    <label class="form-label" for="filtroEstado">Estado</label>
                    <select class="form-select" id="filtroEstado">
                        <option value="">Todos</option>
                        <option value="ABIERTO">ABIERTO</option>
                        <option value="EN_CURSO">EN_CURSO</option>
                        <option value="FINALIZADO">FINALIZADO</option>
                    </select>
                </div>
                <div class="col-auto">
                    <label class="form-label" for="filtroVideojuego">Videojuego</label>
                    <select class="form-select" id="filtroVideojuego">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="col-auto">
                    <button type="button" class="btn btn-outline-primary" id="botonFiltrar">Filtrar</button>
                </div>
            </div>

            <table class="table table-striped align-middle">
                <thead>
                <tr><th>ID</th><th>Nombre</th><th>Fecha</th><th>Premio</th><th>Estado</th><th>Videojuego</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tablaTorneos"></tbody>
            </table>
            <div id="participantesTorneo" class="resultado"></div>

            <div class="row g-4 mt-2">
                <!-- Formulario de torneo -->
                <div class="col-lg-6">
                    <div class="card">
                        <div class="card-header">Torneo</div>
                        <div class="card-body">
                            <form id="formTorneo">
                                <input type="hidden" id="torneoId">
                                <div class="mb-3">
                                    <label class="form-label" for="torneoNombre">Nombre</label>
                                    <input type="text" class="form-control" id="torneoNombre" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="torneoFecha">Fecha</label>
                                    <input type="date" class="form-control" id="torneoFecha" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="torneoPremio">Premio (€)</label>
                                    <input type="number" class="form-control" id="torneoPremio" step="0.01" min="0" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="torneoEstado">Estado</label>
                                    <select class="form-select" id="torneoEstado">
                                        <option value="ABIERTO">ABIERTO</option>
                                        <option value="EN_CURSO">EN_CURSO</option>
                                        <option value="FINALIZADO">FINALIZADO</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="torneoVideojuego">Videojuego</label>
                                    <select class="form-select" id="torneoVideojuego"></select>
                                </div>
                                <button type="submit" class="btn btn-primary" id="botonTorneo">Crear torneo</button>
                                <button type="button" class="btn btn-secondary" id="cancelarTorneo">Cancelar</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Inscribir jugador en torneo -->
                <div class="col-lg-6">
                    <div class="card">
                        <div class="card-header">Inscribir jugador en torneo</div>
                        <div class="card-body">
                            <form id="formParticipacion">
                                <div class="mb-3">
                                    <label class="form-label" for="participacionJugador">Jugador</label>
                                    <select class="form-select" id="participacionJugador"></select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="participacionTorneo">Torneo</label>
                                    <select class="form-select" id="participacionTorneo"></select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="participacionPuntos">Puntos</label>
                                    <input type="number" class="form-control" id="participacionPuntos" min="0" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="participacionPosicion">Posición</label>
                                    <input type="number" class="form-control" id="participacionPosicion" min="0" required>
                                </div>
                                <button type="submit" class="btn btn-primary">Inscribir jugador</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <h3 class="h5 mt-4">Todas las participaciones</h3>
            <table class="table table-striped align-middle">
                <thead>
                <tr><th>ID</th><th>Jugador</th><th>Torneo</th><th>Puntos</th><th>Posición</th></tr>
                </thead>
                <tbody id="tablaParticipaciones"></tbody>
            </table>
        </div>

        <!-- ===================== JUGADORES ===================== -->
        <div class="tab-pane fade" id="tabJugadores">
            <h2 class="mb-3">Jugadores</h2>

            <table class="table table-striped align-middle">
                <thead>
                <tr><th>ID</th><th>Nick</th><th>Email</th><th>Nivel</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tablaJugadores"></tbody>
            </table>
            <div id="participacionesJugador" class="resultado"></div>

            <div class="card mt-4" style="max-width: 600px;">
                <div class="card-header">Jugador</div>
                <div class="card-body">
                    <form id="formJugador">
                        <input type="hidden" id="jugadorId">
                        <div class="mb-3">
                            <label class="form-label" for="jugadorNick">Nick</label>
                            <input type="text" class="form-control" id="jugadorNick" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="jugadorEmail">Email</label>
                            <input type="email" class="form-control" id="jugadorEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="jugadorNivel">Nivel</label>
                            <input type="number" class="form-control" id="jugadorNivel" min="1" required>
                        </div>
                        <button type="submit" class="btn btn-primary" id="botonJugador">Crear jugador</button>
                        <button type="button" class="btn btn-secondary" id="cancelarJugador">Cancelar</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- ===================== VIDEOJUEGOS ===================== -->
        <div class="tab-pane fade" id="tabVideojuegos">
            <h2 class="mb-3">Videojuegos</h2>

            <table class="table table-striped align-middle">
                <thead>
                <tr><th>ID</th><th>Nombre</th><th>Género</th></tr>
                </thead>
                <tbody id="tablaVideojuegos"></tbody>
            </table>

            <div class="card mt-4" style="max-width: 600px;">
                <div class="card-header">Videojuego</div>
                <div class="card-body">
                    <form id="formVideojuego">
                        <div class="mb-3">
                            <label class="form-label" for="videojuegoNombre">Nombre</label>
                            <input type="text" class="form-control" id="videojuegoNombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="videojuegoGenero">Género</label>
                            <input type="text" class="form-control" id="videojuegoGenero" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Crear videojuego</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
