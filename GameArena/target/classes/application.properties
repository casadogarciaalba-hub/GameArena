spring.application.name=GameArena

# Consola web de H2 -> http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Base de datos H2 en MODO ARCHIVO: los datos se guardan en la carpeta ./data
# y NO se pierden al apagar la aplicacion
spring.datasource.url=jdbc:h2:file:./data/gamearena
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate: crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
